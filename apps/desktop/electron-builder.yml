appId: dev.gridloc.iouinator
productName: IOUinator
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # The window icon on Linux and Windows (macOS takes the bundle's icon.icns).
  - build/icon.png
asar: true
# Electron's fuses, flipped before signing: no running as Node, no NODE_OPTIONS or --inspect, and code loaded
# only from app.asar, checked against its hash. Pages come from app://, never file://. Cookie encryption stays
# off: on macOS it adds a Keychain item and can prompt.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
# One naming scheme on every system: IOUinator-0.1.0-mac-arm64.dmg, IOUinator-0.1.0-win-x64.exe, …
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.utilities
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature, so Apple silicon will run a local build. Swap for a Developer ID to distribute.
  identity: '-'
linux:
  target: [AppImage]
  # The package name (@iouinator/desktop) isn't a usable file name.
  executableName: iouinator
  category: Utility
win:
  target: [nsis]
